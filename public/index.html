<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>R Analytics Studio</title>
<style>
:root{--bg:#fff;--bg2:#f3f3f3;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#d4d4d4;--ac:#0b62c4;--hv:#e6e6e6;--sw:230px;--bh:230px}
.dark{--bg:#1e1e1e;--bg2:#252526;--fg:#ccc;--mu:#8a8a8a;--bd:#3c3c3c;--ac:#4fa3ff;--hv:#2f3133}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:12px -apple-system,"Segoe UI",Helvetica,sans-serif}
#app{display:grid;height:100%;grid-template-rows:26px 32px 1fr 22px}
#menu{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);position:relative;overflow-x:auto}#menu>span{padding:5px 10px;cursor:pointer;white-space:nowrap}#menu>span:hover,#menu>span.on{background:var(--hv)}
#dd{position:fixed;z-index:20;background:var(--bg);border:1px solid var(--bd);box-shadow:0 2px 8px #0003;min-width:200px;display:none}#dd div{padding:7px 14px;cursor:pointer}#dd div:hover{background:var(--ac);color:#fff}
#bar{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--bd);background:var(--bg);overflow-x:auto}
button{font:inherit;background:none;color:var(--fg);border:1px solid transparent;border-radius:2px;padding:4px 9px;cursor:pointer;white-space:nowrap}button:hover{background:var(--hv);border-color:var(--bd)}
.sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
#main{display:flex;min-height:0;position:relative}
#side{width:var(--sw);display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--bd);min-width:0}#side.off{display:none}
.stabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto}.stabs div{padding:6px 9px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}.stabs .on{color:var(--fg);border-color:var(--ac)}
.sp{display:none;flex:1;overflow:auto;padding:4px 0}.sp.on{display:block}.row{padding:4px 10px;cursor:pointer;display:flex;gap:8px;justify-content:space-between;white-space:nowrap}.row:hover{background:var(--hv)}.row.on{background:var(--hv);font-weight:600}.row i{font-style:normal;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.ph{display:flex;gap:2px;padding:2px 6px}.ph input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--bd);padding:3px 6px;font:inherit}
.hz{width:5px;cursor:col-resize;background:var(--bd);touch-action:none;flex:none}.hv{height:5px;cursor:row-resize;background:var(--bd);touch-action:none;flex:none}
#mid{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}.tab{padding:6px 10px;cursor:pointer;border-right:1px solid var(--bd);color:var(--mu);white-space:nowrap}.tab.on{background:var(--bg);color:var(--fg);border-top:2px solid var(--ac)}.tab .x{margin-left:8px;padding:0 3px}.tab .x:hover{background:var(--hv)}
#ew{flex:1;min-height:60px;position:relative}#editor{position:absolute;inset:0}
#pb{display:none;position:absolute;z-index:8;top:8px;left:50%;transform:translateX(-50%);width:min(560px,92%);background:var(--bg);border:1px solid var(--ac);box-shadow:0 2px 10px #0004;padding:6px}#pb input{width:100%;background:var(--bg);color:var(--fg);border:0;outline:0;font:13px inherit;padding:4px}
#bottom{height:var(--bh);display:flex;flex-direction:column;min-height:40px;background:var(--bg)}
.bp{display:none;flex:1;min-height:0;flex-direction:column}.bp.on{display:flex}
#log,#plots{flex:1;overflow:auto;padding:6px 10px;font:12px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.cmd{color:var(--ac)}.err{color:#c62828}.dark .err{color:#f48771}
#cl{display:flex;border-top:1px solid var(--bd);font:12px ui-monospace,Menlo,monospace}#cl b{padding:5px 6px 5px 10px;color:var(--ac)}#cin{flex:1;background:var(--bg);color:var(--fg);border:0;outline:0;font:inherit;padding:5px 0}
#plots img{max-width:100%;display:block;border:1px solid var(--bd);background:#fff;margin-bottom:4px}#plots a{color:var(--ac);margin-right:12px;cursor:pointer}
#asst{display:none;width:300px;flex-direction:column;border-left:1px solid var(--bd);background:var(--bg2);flex:none}#asst.on{display:flex}#asst h5{margin:0;padding:7px 10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;font-size:12px}#at{flex:1;overflow:auto;padding:10px;white-space:pre-wrap;line-height:1.5}
#st{display:flex;justify-content:space-between;background:var(--ac);color:#fff;padding:3px 10px}
@media(max-width:760px){#side,#asst{position:absolute;z-index:7;top:0;bottom:0;box-shadow:0 0 10px #0005}#side{left:0;width:min(260px,80vw)}#asst{right:0;width:min(300px,85vw)}.hz{display:none}}
</style></head><body><div id="app">
<div id="menu"></div><div id="dd"></div>
<div id="bar"><button onclick="newTab()">New R Script</button><button onclick="$('#open').click()">Open File</button><button onclick="save()">Save</button><span class="sep"></span><button onclick="runSel()">Run</button><button onclick="srcAll()">Source</button><button onclick="stop()">Stop Execution</button></div>
<div id="main"><div id="side"><div class="stabs" id="stabs"></div>
<div class="sp on" id="p-Files"><div class="ph"><button onclick="$('#up').click()">Upload</button><button onclick="refresh()">Refresh</button></div><div id="fl"></div></div>
<div class="sp" id="p-Environment"><div class="ph"><button onclick="reset()">Clear workspace</button></div><div id="ev"></div></div>
<div class="sp" id="p-History"><div id="hl"></div></div>
<div class="sp" id="p-Packages"><div class="ph"><input id="pf" placeholder="Filter installed packages" oninput="pkList()"></div><div id="pl"></div></div></div>
<div class="hz" id="hs"></div>
<div id="mid"><div id="tabs"></div><div id="ew"><div id="editor"></div><div id="pb"><input id="pi" placeholder="Code Assistant: describe the code to generate, then Enter (Esc to close)"></div></div>
<div class="hv" id="hb"></div>
<div id="bottom"><div class="stabs" id="btabs"></div>
<div class="bp on" id="b-Console"><div id="log"></div><div id="cl"><b>&gt;</b><input id="cin" autocapitalize="off" autocorrect="off" spellcheck="false"></div></div>
<div class="bp" id="b-Plots"><div id="plots"><span style="color:var(--mu)">No plots yet.</span></div></div></div></div>
<div id="asst"><h5><span>Code Assistant</span><span style="cursor:pointer" onclick="asst(0)">Close</span></h5><div id="at"></div></div></div>
<div id="st"><span id="rs">R session ready</span><span id="cp">Ln 1, Col 1</span></div></div>
<input id="up" type="file" accept=".csv,.tsv,.txt" hidden><input id="open" type="file" accept=".r,.R,.txt" hidden>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
const $=s=>document.querySelector(s);let ed,T=[],A=0,lastError='',envL=[],un=1,hist=[];
try{hist=JSON.parse(localStorage.rh||'[]')}catch{}
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min';
window.MonacoEnvironment={getWorkerUrl:()=>URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`],{type:'text/javascript'}))};
require.config({paths:{vs:base+'/vs'}});
const FN='library read.csv head tail summary str plot hist boxplot lm glm t.test chisq.test cor anova table mean sd median quantile data.frame ggplot aes geom_point geom_line geom_boxplot geom_histogram geom_bar theme_minimal mutate filter select group_by summarise arrange pivot_longer'.split(' ');
require(['vs/editor/editor.main'],async()=>{
  ed=monaco.editor.create($('#editor'),{model:null,theme:'vs',automaticLayout:true,fontSize:14,minimap:{enabled:false},folding:true,renderLineHighlight:'all',scrollBeyondLastLine:false,quickSuggestions:true,tabSize:2,fontFamily:'ui-monospace,Menlo,Consolas,monospace'});
  const K=monaco.KeyMod,C=monaco.KeyCode;
  ed.addCommand(K.CtrlCmd|C.Enter,runSel);ed.addCommand(K.CtrlCmd|K.Shift|C.Enter,srcAll);ed.addCommand(K.CtrlCmd|C.KeyS,save);ed.addCommand(K.CtrlCmd|K.Shift|C.KeyA,promptBox);
  [['fix','Fix Code',1],['explain','Explain Code',1],['refactor','Refactor',1],['generate','Generate Code',0]].forEach(([m,l,s],i)=>ed.addAction({id:'ai.'+m,label:'Code Assistant: '+l,contextMenuGroupId:'9_ai',contextMenuOrder:i,precondition:s?'editorHasSelection':null,run:()=>m==='generate'?promptBox():ai(m)}));
  monaco.languages.registerCompletionItemProvider('r',{provideCompletionItems:()=>({suggestions:[...FN,...envL.map(e=>e[0])].map(l=>({label:l,kind:monaco.languages.CompletionItemKind.Function,insertText:l}))})});
  ed.onDidChangeCursorPosition(e=>$('#cp').textContent=`Ln ${e.position.lineNumber}, Col ${e.position.column}`);
  await refresh();const f=(await api('/api/files')).find(n=>/\.r$/i.test(n));
  if(f)await openSrv(f);else newTab();
  run('invisible(NULL)',true);if(innerWidth<760)sb()});
function tabSet(id,names,fn){const b=$('#'+id);b.textContent='';names.forEach((n,i)=>{const d=mk('div',i?'':'on',n);d.onclick=()=>{[...b.children].forEach(x=>x.classList.toggle('on',x===d));fn(n)};b.append(d)})}
tabSet('stabs',['Files','Environment','History','Packages'],n=>{document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x.id==='p-'+n));if(n==='Packages')pkList();if(n==='History')hRender()});
tabSet('btabs',['Console','Plots'],n=>document.querySelectorAll('.bp').forEach(x=>x.classList.toggle('on',x.id==='b-'+n)));
const bt=n=>[...$('#btabs').children].find(x=>x.textContent===n).click();
function rt(){const b=$('#tabs');b.textContent='';T.forEach((t,i)=>{const d=mk('div','tab'+(i===A?' on':''),t.name+(t.m.getValue()!==t.saved?' \u2022':''));d.onclick=()=>sw(i);const x=mk('span','x','\u00d7');x.onclick=e=>{e.stopPropagation();closeTab(i)};d.append(x);b.append(d)})}
function addTab(name,text,saved){const m=monaco.editor.createModel(text,'r');m.onDidChangeContent(rt);T.push({name,m,saved:saved===undefined?text:saved});sw(T.length-1)}
function sw(i){A=i;ed.setModel(T[i].m);rt();ed.focus()}
function newTab(){addTab('Untitled'+(un++)+'.R','# New script\n','')}
function closeTab(i){const t=T[i];if(t.m.getValue()!==t.saved&&!confirm('Close '+t.name+' without saving?'))return;t.m.dispose();T.splice(i,1);if(!T.length)newTab();else sw(Math.min(A,T.length-1));rt()}
async function openSrv(n){const k=T.findIndex(t=>t.name===n);if(k>=0)return sw(k);const j=await api('/api/file?name='+encodeURIComponent(n));addTab(n,j.content)}
async function save(){const t=T[A];if(/^Untitled/.test(t.name)){let n=prompt('Save as',t.name.replace('Untitled','script'));if(!n)return;t.name=/\.r$/i.test(n)?n:n+'.R'}
  const r=await api('/api/files',{name:t.name,content:t.m.getValue()});t.name=r.name;t.saved=t.m.getValue();rt();refresh()}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([T[A].m.getValue()],{type:'text/plain'}));a.download=T[A].name;a.click()}
$('#open').onchange=async e=>{const f=e.target.files[0];if(f)addTab(f.name,await f.text(),'');e.target.value=''};
$('#up').onchange=async e=>{const f=e.target.files[0];if(!f)return;await api('/api/files',{name:f.name,content:await f.text()});await refresh();e.target.value=''};
async function refresh(){const fs=await api('/api/files');const d=$('#fl');d.textContent='';
  fs.forEach(n=>{const r=mk('div','row');r.append(mk('span','',n));r.onclick=()=>{if(/\.r$/i.test(n))openSrv(n);else{const v=n.replace(/\.\w+$/,'').replace(/\W+/g,'_');ed.executeEdits('f',[{range:ed.getSelection(),text:`${v} <- read.csv("${n}")\n`}])}};d.append(r)})}
function setEnv(e){envL=e||[];const d=$('#ev');d.textContent='';if(!envL.length)d.append(mk('div','row',''),mk('i','','  Workspace is empty'));
  envL.forEach(([n,c,s])=>{const r=mk('div','row');r.append(mk('span','',n),mk('i','',(c||'')+(s?' ['+s+']':'')));r.onclick=()=>run(`str(${n})`);d.append(r)})}
function hRender(){const d=$('#hl');d.textContent='';hist.slice().reverse().forEach(h=>{const r=mk('div','row');r.append(mk('span','',h.split('\n')[0].slice(0,60)));r.onclick=()=>{$('#cin').value=h.split('\n')[0];bt('Console');$('#cin').focus()};d.append(r)})}
let pks=null;async function pkList(){if(!pks)pks=await api('/api/packages');const f=$('#pf').value.toLowerCase(),d=$('#pl');d.textContent='';
  pks.filter(p=>p[0].toLowerCase().includes(f)).forEach(([n,v])=>{const r=mk('div','row');r.append(mk('span','',n),mk('i','',v));r.onclick=()=>ed.executeEdits('p',[{range:ed.getSelection(),text:`library(${n})\n`}]);d.append(r)})}
function log(t,c){const l=$('#log'),s=mk('span',c||'',t.endsWith('\n')?t:t+'\n');l.append(s);l.scrollTop=l.scrollHeight}
function busy(b){$('#rs').textContent=b?'R is running...':'R session ready'}
async function run(code,silent){if(!code.trim())return;busy(1);
  if(!silent){log('> '+code.split('\n').join('\n+ '),'cmd');hist.push(code);hist=hist.slice(-200);try{localStorage.rh=JSON.stringify(hist)}catch{}}
  try{const j=await api('/api/run',{code});if(!silent){if(j.stdout)log(j.stdout);if(j.stderr)log(j.stderr,'err');lastError=j.stderr||''}
    if(j.error)log('['+j.error+']','err');setEnv(j.env);
    if(j.plots.length){const p=$('#plots');if(p.firstChild&&p.firstChild.tagName==='SPAN')p.textContent='';
      j.plots.reverse().forEach(b=>{const s='data:image/png;base64,'+b,w=mk('div'),i=new Image(),a=mk('a','','Save PNG');i.src=s;a.onclick=()=>{const k=document.createElement('a');k.href=s;k.download='plot.png';k.click()};w.append(i,a);p.prepend(w)});bt('Plots')}}
  catch(e){log(e.message,'err')}busy(0)}
function runSel(){const m=ed.getModel(),s=m.getValueInRange(ed.getSelection());run(s||m.getLineContent(ed.getPosition().lineNumber))}
function srcAll(){run(ed.getValue())}
async function stop(){await api('/api/stop',{})}
async function reset(){if(!confirm('Remove all objects from the R session?'))return;await api('/api/reset',{});setEnv([]);log('[R session restarted]','err')}
$('#cin').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value;e.target.value='';run(v)}};
function asst(on,t){$('#asst').classList.toggle('on',on!==0);if(t!==undefined)$('#at').textContent=t}
function sb(){$('#side').classList.toggle('off')}
function promptBox(){const b=$('#pb');b.style.display='block';$('#pi').value='';$('#pi').focus()}
$('#pi').onkeydown=e=>{if(e.key==='Escape'){$('#pb').style.display='none';ed.focus()}if(e.key==='Enter'&&e.target.value.trim()){const p=e.target.value;$('#pb').style.display='none';ai('generate',p)}};
async function ai(mode,prompt){const m=ed.getModel(),sel=ed.getSelection(),s=m.getValueInRange(sel);
  const code=mode==='interpret'?$('#log').textContent.slice(-4000):(s||(mode==='generate'?'':ed.getValue()));
  $('#rs').textContent='Code Assistant working...';
  try{const {text}=await api('/api/ai',{mode,prompt,code,error:mode==='fix'?lastError:'',env:envL.map(e=>`${e[0]} (${e[1]} ${e[2]})`).join(', ')});
    const c=text.match(/```(?:r|R)?\n([\s\S]*?)```/);
    if(c&&['generate','fix','refactor'].includes(mode)){const range=mode==='generate'?sel:(s?sel:m.getFullModelRange());
      ed.executeEdits('ai',[{range,text:c[1].trim()+'\n'}]);const note=text.replace(c[0],'').trim();if(note)asst(1,note)}
    else asst(1,text)}catch(e){asst(1,'Code Assistant error: '+e.message)}busy(0)}
const ed_=id=>ed.trigger('menu',id,null);
const MENU={File:[['New R Script',newTab],['Open File...',()=>$('#open').click()],['Save',save],['Download .R',dl],['Upload Data...',()=>$('#up').click()]],
Edit:[['Undo',()=>ed_('undo')],['Redo',()=>ed_('redo')],['Find',()=>ed_('actions.find')],['Replace',()=>ed_('editor.action.startFindReplace')],['Toggle Comment',()=>ed_('editor.action.commentLine')]],
Code:[['Run Line or Selection',runSel],['Source Script',srcAll],['Fold All',()=>ed_('editor.foldAll')],['Unfold All',()=>ed_('editor.unfoldAll')],['Command Palette',()=>ed_('editor.action.quickCommand')]],
View:[['Toggle Dark Theme',()=>{document.body.parentElement.classList.toggle('dark');monaco.editor.setTheme(document.documentElement.classList.contains('dark')?'vs-dark':'vs')}],['Toggle Sidebar',sb],['Toggle Code Assistant',()=>asst($('#asst').classList.contains('on')?0:1)],['Clear Console',()=>$('#log').textContent='']],
Run:[['Run Line or Selection',runSel],['Source Script',srcAll],['Stop Execution',stop],['Restart R Session',reset]],
Tools:[['Code Assistant: Generate Code...',promptBox],['Code Assistant: Interpret Console Output',()=>ai('interpret')],['Code Assistant: Suggest Statistical Method',()=>ai('suggest',prompt('Describe your data and research question')||'')]],
Help:[['Keyboard Shortcuts',()=>alert('Ctrl/Cmd+Enter: run line or selection\nCtrl/Cmd+Shift+Enter: source script\nCtrl/Cmd+S: save\nCtrl/Cmd+Shift+A: Code Assistant\nF1: command palette\nRight-click selected code: Fix, Explain, Refactor')]]};
Object.keys(MENU).forEach(k=>{const s=mk('span','',k);s.onclick=e=>{e.stopPropagation();const d=$('#dd');d.textContent='';MENU[k].forEach(([l,f])=>{const i=mk('div','',l);i.onclick=()=>{d.style.display='none';f()};d.append(i)});const r=s.getBoundingClientRect();d.style.left=Math.min(r.left,innerWidth-210)+'px';d.style.top=r.bottom+'px';d.style.display='block'};$('#menu').append(s)});
document.addEventListener('click',()=>$('#dd').style.display='none');
function drag(el,fn){el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.onpointermove=fn;el.onpointerup=()=>el.onpointermove=null}}
const rs=document.documentElement.style;
drag($('#hs'),e=>rs.setProperty('--sw',Math.max(140,Math.min(500,e.clientX))+'px'));
drag($('#hb'),e=>rs.setProperty('--bh',Math.max(60,$('#mid').getBoundingClientRect().bottom-e.clientY)+'px'));
</script></body></html>
