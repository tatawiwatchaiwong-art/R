<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Medical Data Analysis IDE</title>
<style>
:root{--bg:#fff;--bg2:#f3f3f3;--fg:#1f1f1f;--mu:#6b6b6b;--bd:#d4d4d4;--ac:#0b62c4;--hv:#e6e6e6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px -apple-system,"Segoe UI",Helvetica,sans-serif}
#app{display:grid;height:100%;grid-template-rows:34px 1fr;grid-template-columns:170px 1fr}
#top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto}#top b{margin-right:6px;white-space:nowrap}
#nav{background:var(--bg2);border-right:1px solid var(--bd);padding:6px 0;overflow:auto}#nav div{padding:8px 14px;cursor:pointer;color:var(--mu)}#nav div:hover{background:var(--hv)}#nav .on{color:var(--fg);background:var(--bg);border-left:3px solid var(--ac);font-weight:600}
#main{overflow:auto;padding:14px 18px;min-width:0}
h3{margin:0 0 10px;font-size:15px}h4{margin:14px 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:2px;padding:5px 10px;cursor:pointer;white-space:nowrap}button:hover{background:var(--hv)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input,select,textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);padding:5px 7px;border-radius:2px;max-width:100%}textarea{width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;min-height:110px}
.card{border:1px solid var(--bd);margin-bottom:12px}.h{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-wrap:wrap}.h input{flex:1;min-width:140px;font-weight:600}
.card>*:not(.h){margin:8px}.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>input[type=text],.row>input:not([type]){flex:1;min-width:160px}
pre{margin:0;font:12px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:var(--bg2);padding:8px;max-height:320px;overflow:auto}.err{color:#c62828}
table{border-collapse:collapse;font-size:12px}th,td{border:1px solid var(--bd);padding:4px 8px;text-align:left}th{background:var(--bg2)}.sc{overflow-x:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:34px auto 1fr}#nav{display:flex;overflow-x:auto;padding:0}#nav div{white-space:nowrap;padding:8px 10px}#nav .on{border-left:0;border-bottom:3px solid var(--ac)}#top{grid-column:1}}
</style></head><body><div id="app">
<div id="top"><b>Medical Data Analysis IDE</b><select id="ps" onchange="openP(this.value)"></select><button onclick="newP()">New project</button><button onclick="sv(1)">Save</button><a href="/ide.html" style="margin-left:auto;color:var(--ac);white-space:nowrap">Script IDE</a></div>
<div id="nav"></div><div id="main"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAGES=['Project','Dataset','Data Cleaning','Variables','Analysis','Tables','Results','R Script','Export'],SS={'Data Cleaning':'Cleaning',Variables:'Variables',Analysis:'Analysis'};
let P,TL=[],st='Project',tmr;
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
const gem=(mode,prompt,code,ctx)=>api('/api/ai',{mode,prompt,code,ctx}).then(r=>r.text);
const code0=t=>{const m=t.match(/```(?:r|R)?\n([\s\S]*?)```/);return m?m[1].trim():t};
const sv=now=>{clearTimeout(tmr);const f=()=>api('/api/project',{name:P.name,data:P}).catch(()=>{});now?f():tmr=setTimeout(f,600)};
const blank=n=>({name:n,notes:'',instr:'',rubric:'',codebook:'',dataset:'',plan:null,steps:[],tables:[],cols:[],inspect:'',interp:'',check:'',nid:1});
const HELPER=String.raw`mk_table<-function(d,vars,group=NULL,digits=1,ci=TRUE,pval=TRUE,miss="exclude",stat="meansd"){
f<-function(x)formatC(x,format="f",digits=digits)
g<-if(is.null(group))factor(rep("All",nrow(d))) else factor(d[[group]])
lv<-levels(g);if(!is.null(group))lv<-c(lv,"Total")
sel<-function(l)if(l%in%c("Total","All"))rep(TRUE,nrow(d)) else (!is.na(g)&g==l)
R<-list();hasp<-!is.null(group)&&pval
for(v in vars){x<-d[[v]];p<-""
 if(hasp)p<-tryCatch(format.pval(if(is.numeric(x)){if(nlevels(g)>2)kruskal.test(x,g)$p.value else wilcox.test(x~g)$p.value}else chisq.test(table(x,g))$p.value,digits=3,eps=.001),error=function(e)"")
 if(is.numeric(x)){
  cells<-sapply(lv,function(l){y<-x[sel(l)];y<-y[!is.na(y)];if(!length(y))return("-")
   s<-if(stat=="meansd")paste0(f(mean(y))," (",f(sd(y)),")") else paste0(f(median(y))," (",f(quantile(y,.25))," to ",f(quantile(y,.75)),")")
   if(ci&&stat=="meansd"&&length(y)>2){k<-t.test(y)$conf.int;s<-paste0(s,"; 95% CI ",f(k[1])," to ",f(k[2]))};s})
  R[[length(R)+1]]<-c(paste0(v,if(stat=="meansd")", mean (SD)" else ", median (IQR)"),cells,p)
 } else {
  x<-as.character(x);if(miss=="show")x[is.na(x)]<-"Missing";x<-factor(x)
  R[[length(R)+1]]<-c(paste0(v,", n (%)"),rep("",length(lv)),p)
  for(k in levels(x)){cells<-sapply(lv,function(l){y<-x[sel(l)];y<-y[!is.na(y)];m<-length(y);n<-sum(y==k)
    s<-paste0(n," (",f(100*n/max(m,1)),"%)");if(ci&&m>0){q<-prop.test(n,m)$conf.int*100;s<-paste0(s,"; 95% CI ",f(q[1])," to ",f(q[2]))};s})
   R[[length(R)+1]]<-c(paste0("   ",k),cells,"")}
 }}
out<-as.data.frame(do.call(rbind,R),stringsAsFactors=FALSE)
N<-sapply(lv,function(l)sum(sel(l)))
names(out)<-c("Variable",paste0(lv," (n=",N,")"),"p-value")
if(!hasp)out<-out[,-ncol(out),drop=FALSE]
out}
save_tbl<-function(t,id,title="",foot=""){dir.create("outputs",showWarnings=FALSE);write.csv(t,file.path("outputs",paste0(id,".csv")),row.names=FALSE);writeLines(c(title,foot),file.path("outputs",paste0(id,".txt")));print(t,row.names=FALSE)}`;
const INSPECT=String.raw`cat("Dimensions:",nrow(df),"rows x",ncol(df),"columns\n\n");str(df,give.attr=FALSE,vec.len=3)
cat("\nMissing values per column:\n");print(colSums(is.na(df)))
cat("@@COLS\n");cat(paste(names(df),sapply(df,function(x)class(x)[1]),sapply(df,function(x)sum(is.na(x))),sapply(df,function(x)length(unique(x))),sep="\t"),sep="\n")`;
const loadCode=()=>{const f=JSON.stringify(P.dataset);return /\.xlsx?$/i.test(P.dataset)?`df <- as.data.frame(readxl::read_excel(${f}))`:/\.tsv$/i.test(P.dataset)?`df <- read.delim(${f}, fileEncoding = "UTF-8-BOM")`:`df <- read.csv(${f}, fileEncoding = "UTF-8-BOM")`};
const ctx=()=>`Data frame: df (from ${P.dataset||'not loaded'}). Columns (name:type:missing:unique): ${P.cols.map(c=>`${c.n}:${c.c}:${c.m}:${c.u}`).join(', ')}\nCODEBOOK:\n${P.codebook.slice(0,12000)}\nINSTRUCTIONS:\n${P.instr.slice(0,15000)}\nRUBRIC:\n${P.rubric.slice(0,10000)}\nNOTES:\n${P.notes}`;
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function up(kind,inp){const f=inp.files[0];if(!f)return;try{const {name}=await api('/api/upload',{name:f.name,b64:await b64(f)});
  if(kind==='dataset')P.dataset=name;else{const j=await api('/api/text?name='+encodeURIComponent(name));P[kind]=j.text;P[kind+'F']=name;if(!j.text)alert('Could not read text from this file. '+(j.error||''))}sv();show()}catch(e){alert(e.message)}}
async function inspect(){if(!P.dataset)return alert('Upload a dataset in Project first');
  const j=await api('/api/run',{code:loadCode()+'\n'+INSPECT}),o=j.stdout+(j.stderr||''),[a,b]=o.split('@@COLS\n');
  P.inspect=a;P.cols=(b||'').trim().split('\n').filter(Boolean).map(l=>{const[n,c,m,u]=l.split('\t');return{n,c,m,u}});sv();show()}
async function plan(){if(!P.instr)return alert('Upload the assignment instructions first');$('#pst').textContent='Gemini is reading the materials...';
  try{if(P.dataset&&!P.cols.length)await inspect();
  const t=await gem('plan','Return ONLY valid JSON (no markdown): {"summary":"","requirements":{"variables":[],"cleaning":[],"derived":[],"methods":[],"tables":[],"figures":[],"report_format":"","outputs":[]},"steps":[{"stage":"Cleaning|Variables|Analysis","title":"","desc":"","code":"reproducible R using df"}],"tables":[{"title":"","vars":["exact column names"],"group":"column or empty","stat":"meansd or mediqr","footnote":""}]}','',ctx());
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));P.plan=j;
  P.steps=(j.steps||[]).map(s=>({id:P.nid++,stage:s.stage,title:s.title,desc:s.desc,code:s.code,out:''}));
  P.tables=(j.tables||[]).map(t=>({id:P.nid++,title:t.title,vars:t.vars||[],group:t.group||'',stat:t.stat||'meansd',ci:true,pval:true,digits:1,miss:'exclude',foot:t.footnote||''}));sv();show()}
  catch(e){$('#pst').textContent='Plan failed: '+e.message+' (try again or add notes)'}}
const li=a=>(a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')+'</ul>':'<span class=mu>none found</span>');
const fileRow=(k,l)=>`<div class=row><span style="width:170px">${l}</span><input type=file onchange="up('${k}',this)"><span class=mu>${esc(k==='dataset'?P.dataset:P[k+'F']||(P[k]?'loaded':''))}</span></div>`;
const R={
Project:()=>`<h3>Assignment configuration</h3>${fileRow('instr','Instructions (PDF/text)')}${fileRow('rubric','Grading rubric (PDF/text)')}${fileRow('codebook','Codebook (PDF/Excel/CSV)')}${fileRow('dataset','Dataset (CSV/Excel)')}
<h4>Additional instructions</h4><textarea onchange="P.notes=this.value;sv()">${esc(P.notes)}</textarea>
<div class=row><button class=p onclick="plan()">Analyze assignment with Gemini</button><span id=pst class=mu></span></div>
${P.plan?`<h4>Summary</h4><div>${esc(P.plan.summary)}</div>${Object.entries(P.plan.requirements||{}).map(([k,v])=>`<h4>${esc(k.replace(/_/g,' '))}</h4>${Array.isArray(v)?li(v):esc(v)}`).join('')}<div class=mu style="margin-top:10px">${P.steps.length} steps and ${P.tables.length} tables were created. Edit them in the stages on the left.</div>`:''}`,
Dataset:()=>`<h3>Dataset</h3><div class=row><span>${esc(P.dataset||'No dataset')}</span><button class=p onclick="inspect()">Load and inspect</button></div><pre>${esc(loadCode&&P.dataset?loadCode():'')}</pre>${P.inspect?`<h4>Structure</h4><pre>${esc(P.inspect)}</pre>`:''}`,
'Data Cleaning':()=>stepsView(),
Variables:()=>`<h3>Variables</h3>${P.cols.length?`<div class=sc><table><tr><th>Name</th><th>Type</th><th>Missing</th><th>Unique</th></tr>${P.cols.map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.c)}</td><td>${esc(c.m)}</td><td>${esc(c.u)}</td></tr>`).join('')}</table></div>`:'<span class=mu>Load the dataset first.</span>'}<h4>Codebook</h4><textarea onchange="P.codebook=this.value;sv()">${esc(P.codebook)}</textarea>${stepsView()}`,
Analysis:()=>stepsView(),
Tables:()=>{const tt=TL.map((t,i)=>t.kind==='table'?`<option value=${i}>${esc(t.name)}</option>`:'').join('');return `<h3>Tables</h3><div class=row><button onclick="addTable()">Add table</button>${tt?`<select onchange="useTplT(this.value)"><option value="">Insert template...</option>${tt}</select>`:''}</div>`+P.tables.map(tabHTML).join('')},
Results:()=>`<h3>Results and interpretation</h3><div class=row><button onclick="interp()">Interpret outputs with Gemini</button><button onclick="check()">Check against rubric</button><span id=rst class=mu></span></div><h4>Interpretation (editable)</h4><textarea style="min-height:200px" onchange="P.interp=this.value;sv()">${esc(P.interp)}</textarea><h4>Rubric check</h4><pre>${esc(P.check||'Not run yet.')}</pre>`,
'R Script':()=>`<h3>R script</h3><div class=row><button class=p onclick="runFresh()">Run from a clean session</button><button onclick="dlScript()">Download .R</button></div><textarea id=sc style="min-height:360px" spellcheck=false>${esc(script())}</textarea><pre id=so style="margin-top:8px;display:none"></pre>`,
Export:()=>`<h3>Export</h3><div id=ex class=mu>Loading...</div>`};
const stepHTML=(s,i)=>`<div class=card><div class=h><input value="${esc(s.title)}" onchange="P.steps[${i}].title=this.value;sv()"><span><button onclick="runStep(${i})">Run</button><button onclick="tpl('step',${i})">Save as template</button><button onclick="P.steps.splice(${i},1);sv();show()">Delete</button></span></div>${s.desc?`<div class=mu>${esc(s.desc)}</div>`:''}<textarea spellcheck=false onchange="P.steps[${i}].code=this.value;sv()">${esc(s.code)}</textarea><div class=row><input id="q${i}" placeholder="Ask Gemini to rewrite this code"><button onclick="askStep(${i})">Revise</button></div><pre id="o${i}" ${s.out?'':'style="display:none"'}>${esc(s.out)}</pre></div>`;
function stepsView(){const k=SS[st],o=TL.map((t,i)=>t.kind==='step'?`<option value=${i}>${esc(t.name)}</option>`:'').join('');
  return `<div class=row><input id=aq placeholder="Describe what to do in this stage, e.g. recode age into groups"><button class=p onclick="addAI('${k}')">Add step with Gemini</button><button onclick="addStep('${k}')">Blank step</button>${o?`<select onchange="useTpl(this.value,'${k}')"><option value="">Insert template...</option>${o}</select>`:''}</div>`+P.steps.map((s,i)=>s.stage===k?stepHTML(s,i):'').join('')||''}
const addStep=(k,t={})=>{P.steps.push({id:P.nid++,stage:k,title:t.title||'New step',desc:t.desc||'',code:t.code||'',out:''});sv();show()};
async function addAI(k){const q=$('#aq').value.trim();if(!q)return;$('#aq').value='Gemini is writing...';try{addStep(k,{title:q.slice(0,70),code:code0(await gem('step',q,'',ctx()))})}catch(e){alert(e.message)}}
async function askStep(i){const q=$('#q'+i).value.trim();if(!q)return;try{P.steps[i].code=code0(await gem('step',q,P.steps[i].code,ctx()));sv();show()}catch(e){alert(e.message)}}
async function runStep(i){const s=P.steps[i],o=$('#o'+i);o.style.display='block';o.textContent='Running...';try{const j=await api('/api/run',{code:s.code,tag:'s'+s.id});P.env=j.env;s.out=j.stdout+(j.stderr?'\n'+j.stderr:'')+(j.error?'\n['+j.error+']':'')+(j.plots.length?'\n['+j.plots.length+' plot(s) saved for the report]':'');o.textContent=s.out;sv()}catch(e){o.textContent=e.message}}
const q=JSON.stringify,tcode=t=>`t${t.id} <- mk_table(df, vars = c(${t.vars.map(q).join(', ')}), group = ${t.group?q(t.group):'NULL'}, digits = ${+t.digits||1}, ci = ${t.ci?'TRUE':'FALSE'}, pval = ${t.pval?'TRUE':'FALSE'}, miss = "${t.miss}", stat = "${t.stat}")\nsave_tbl(t${t.id}, "t${t.id}", ${q(t.title)}, ${q(t.foot)})`;
const cl=(a,sel)=>a.map(c=>`<option ${sel(c.n)?'selected':''}>${esc(c.n)}</option>`).join('');
const tabHTML=(t,i)=>`<div class=card><div class=h><input value="${esc(t.title)}" onchange="P.tables[${i}].title=this.value;sv()"><span><button class=p onclick="genTable(${i})">Generate</button><button onclick="tpl('table',${i})">Save as template</button><button onclick="P.tables.splice(${i},1);sv();show()">Delete</button></span></div>
<div class=g><label>Variables<br><select multiple size=6 style="width:100%" onchange="P.tables[${i}].vars=[...this.selectedOptions].map(o=>o.value);sv()">${cl(P.cols,n=>t.vars.includes(n))}</select></label>
<div><label>Grouping variable<br><select onchange="P.tables[${i}].group=this.value;sv()"><option value="">(none)</option>${cl(P.cols,n=>n===t.group)}</select></label><br><br><label>Continuous summary<br><select onchange="P.tables[${i}].stat=this.value;sv()"><option value=meansd ${t.stat==='meansd'?'selected':''}>Mean (SD)</option><option value=mediqr ${t.stat==='mediqr'?'selected':''}>Median (IQR)</option></select></label></div>
<div><label><input type=checkbox ${t.ci?'checked':''} onchange="P.tables[${i}].ci=this.checked;sv()"> 95% confidence intervals</label><br><label><input type=checkbox ${t.pval?'checked':''} onchange="P.tables[${i}].pval=this.checked;sv()"> p-values (needs grouping)</label><br><br><label>Decimals <input type=number min=0 max=4 style="width:60px" value="${t.digits}" onchange="P.tables[${i}].digits=this.value;sv()"></label><br><br><label>Missing values<br><select onchange="P.tables[${i}].miss=this.value;sv()"><option value=exclude ${t.miss==='exclude'?'selected':''}>Exclude</option><option value=show ${t.miss==='show'?'selected':''}>Show as category</option></select></label></div></div>
<label>Footnote<br><input style="width:100%" value="${esc(t.foot)}" onchange="P.tables[${i}].foot=this.value;sv()"></label><div id="tp${i}" class=sc></div></div>`;
const addTable=(t={})=>{P.tables.push({id:P.nid++,title:'Table',vars:[],group:'',stat:'meansd',ci:true,pval:true,digits:1,miss:'exclude',foot:'',...t});sv();show()};
const csv=t=>t.trim().split('\n').map(l=>[...l.matchAll(/("([^"]|"")*"|[^,]*)(,|$)/g)].slice(0,-1).map(m=>m[1].replace(/^"|"$/g,'').replace(/""/g,'"')));
async function prev(i){const t=P.tables[i],d=$('#tp'+i);if(!d)return;try{const r=await fetch('/outputs/t'+t.id+'.csv?'+Date.now());if(!r.ok)return;const rows=csv(await r.text());
  d.innerHTML=`<h4>${esc(t.title)}</h4><table>${rows.map((r,k)=>'<tr>'+r.map(c=>k?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')}</table><div class=mu>${esc(t.foot)}</div>`}catch{}}
async function genTable(i){const t=P.tables[i],d=$('#tp'+i);if(!t.vars.length)return alert('Select at least one variable');if(!P.cols.length)return alert('Load the dataset first');d.textContent='Running...';
  try{const j=await api('/api/run',{code:loadCode()+'\n'+HELPER+'\n'+tcode(t)});if(j.stderr&&/Error/.test(j.stderr)){d.innerHTML='<pre class=err>'+esc(j.stderr)+'</pre>';return}prev(i)}catch(e){d.textContent=e.message}}
async function tpl(kind,i){const n=prompt('Template name');if(!n)return;const x=kind==='step'?P.steps[i]:P.tables[i],data=kind==='step'?{title:x.title,desc:x.desc,code:x.code}:{...x,id:undefined,done:undefined};TL.push({name:n,kind,data});await api('/api/templates',{list:TL});alert('Template saved')}
const useTpl=(i,k)=>{if(i!=='')addStep(k,TL[i].data)},useTplT=i=>{if(i!=='')addTable(TL[i].data)};
async function outs(){let o=P.steps.map(s=>`## ${s.title}\n${s.out||''}`).join('\n');for(const t of P.tables){try{o+=`\n## ${t.title}\n`+await (await fetch('/outputs/t'+t.id+'.csv')).text()}catch{}}return o.slice(-14000)}
async function interp(){$('#rst').textContent='Working...';try{P.interp+=(P.interp?'\n\n':'')+await gem('interpret','Interpret these results for a medical student report: effect sizes, confidence intervals, p-values, assumptions and limitations.',await outs(),ctx());sv();show()}catch(e){$('#rst').textContent=e.message}}
async function check(){$('#rst').textContent='Working...';try{P.check=await gem('check','Compare the outputs against the rubric and instructions. List each requirement as Met, Partly or Missing, with what to fix.',await outs()+'\n\nINTERPRETATION:\n'+P.interp,ctx());sv();show()}catch(e){$('#rst').textContent=e.message}}
function script(){const g=k=>P.steps.filter(s=>s.stage===k).map(s=>`# ---- ${s.title}\n${s.code}\n`).join('\n');
  return `# ${P.name}\n# Generated by Medical Data Analysis IDE\n\n# ---- Load data\n${P.dataset?loadCode():'# (no dataset)'}\n\n`+g('Cleaning')+g('Variables')+g('Analysis')+(P.tables.length?`\n# ---- Table helpers\n${HELPER}\n\n`+P.tables.map(t=>`# ---- ${t.title}\n${tcode(t)}\n`).join('\n'):'')}
function dlScript(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#sc').value],{type:'text/plain'}));a.download=P.name.replace(/\W+/g,'_')+'.R';a.click()}
async function runFresh(){const o=$('#so');o.style.display='block';o.textContent='Running...';try{await api('/api/reset',{});const j=await api('/api/run',{code:$('#sc').value,tag:'script'});o.textContent=j.stdout+(j.stderr?'\n'+j.stderr:'')+(j.error?'\n['+j.error+']':'')}catch(e){o.textContent=e.message}}
const wc=t=>(t.trim().match(/\S+/g)||[]).length;
async function exp(){const d=$('#ex');if(!d)return;const o=await api('/api/outputs');
  d.innerHTML=`<div class=row><span style="width:120px">Report title</span><input id=rt value="${esc(P.name)}"></div><h4>Tables (${o.tables.length})</h4>${o.tables.map(f=>`<div><a href="/outputs/${f}" download>${f}</a></div>`).join('')||'<span class=mu>Generate tables first.</span>'}<h4>Figures (${o.figures.length})</h4>${o.figures.map(f=>`<div><a href="/outputs/figures/${f}" download>${f}</a></div>`).join('')||'<span class=mu>Run steps that make plots.</span>'}
<div class=row style="margin-top:14px"><button class=p onclick="buildDoc()">Build Word report (.docx)</button><button onclick="dlScriptX()">Download R script</button><span id=ed></span></div>`;await delivUI()}
const docHTML=(e,i,objs)=>`<div class=card><div class=h><span>${esc(P.prefix||'prefix')}_<input style="width:140px;flex:none" value="${esc(e.file)}" onchange="P.doc[${i}].file=this.value;sv()">.docx</span><span><button class=p onclick="mkDoc(${i})">Build</button><button onclick="P.doc.splice(${i},1);sv();show()">Delete</button></span></div>
<label>R object (table)<br><select onchange="P.doc[${i}].obj=this.value;sv()"><option value="">(choose)</option>${objs.map(o=>`<option ${o[0]===e.obj?'selected':''} value="${esc(o[0])}">${esc(o[0])} (${esc(o[1])})</option>`).join('')}</select></label>
<label>Title<br><input style="width:100%" value="${esc(e.title)}" onchange="P.doc[${i}].title=this.value;sv()"></label>
<label>Footnote (abbreviations, definitions, denominators)<br><textarea style="min-height:70px" onchange="P.doc[${i}].foot=this.value;sv()">${esc(e.foot)}</textarea></label>
<label>Narrative under the table <span id="wc${i}" class=mu>${wc(e.text)} words</span><br><textarea oninput="P.doc[${i}].text=this.value;const n=wc(this.value),s=document.getElementById('wc${i}');s.textContent=n+' words (limit 100)';s.className=n>100?'err':'mu'" onchange="sv()">${esc(e.text)}</textarea></label><div id="ds${i}"></div></div>`;
async function delivUI(){const d=$('#ex');try{P.env=(await api('/api/run',{code:'invisible(NULL)'})).env}catch{}P.doc=P.doc||[];const objs=(P.env||[]).filter(e=>/^tbl_|data.frame|tibble/.test(e[1])),a=document.createElement('div');
  a.innerHTML=`<h4>Submission files</h4><div class=row><span style="width:150px">File name prefix</span><input value="${esc(P.prefix||'')}" placeholder="6612345_assignment1" onchange="P.prefix=this.value;sv();show()"></div>
<div class=row><button onclick="dlNamed()">Download script (.R)</button><span class=mu>Data object</span><input id=co value="df" style="width:90px;flex:none"><button onclick="mkCsv()">Build transformed_df.csv</button><span id=cs></span></div>
<h4>Word table files (table + footnote + narrative)</h4>${P.doc.map((e,i)=>docHTML(e,i,objs)).join('')}<button onclick="P.doc.push({file:'Table'+(P.doc.length+1),obj:'',title:'',foot:'',text:''});sv();show()">Add Word table file</button><div class=mu style="margin-top:8px">Tables use three horizontal lines and no vertical lines. Re-run the script first so the table objects exist in the R session.</div>`;d.append(a)}
function dlNamed(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([script()],{type:'text/plain'}));a.download=(P.prefix||'analysis')+'_script.R';a.click()}
async function mkCsv(){if(!P.prefix)return alert('Set the file prefix first');const fn=P.prefix+'_transformed_df.csv',s=$('#cs');s.textContent='Building...';const j=await api('/api/run',{code:`dir.create("outputs",showWarnings=FALSE)\nwrite.csv(${$('#co').value}, ${q('outputs/'+fn)}, row.names = FALSE)`});s.innerHTML=/Error/.test(j.stderr||'')?`<span class=err>${esc(j.stderr)}</span>`:`<a href="/outputs/${encodeURIComponent(fn)}" download>${esc(fn)}</a>`}
async function mkDoc(i){const e=P.doc[i],o=(P.env||[]).find(x=>x[0]===e.obj),s=$('#ds'+i);if(!P.prefix||!e.obj)return alert('Set the file prefix and choose the table object');
  const fn=`${P.prefix}_${e.file}.docx`,conv=o&&/^tbl_/.test(o[1])?`gtsummary::as_flex_table(${e.obj})`:`flextable::flextable(as.data.frame(${e.obj}))`;
  const code=`dir.create("outputs",showWarnings=FALSE)\nft <- ${conv} |> flextable::theme_booktabs() |> flextable::autofit()\ndoc <- officer::read_docx()\ndoc <- officer::body_add_par(doc, ${q(e.title)})\ndoc <- flextable::body_add_flextable(doc, ft)\ndoc <- officer::body_add_par(doc, ${q(e.foot)})\ndoc <- officer::body_add_par(doc, "")\ndoc <- officer::body_add_par(doc, ${q(e.text)})\nprint(doc, target = ${q('outputs/'+fn)})`;
  s.textContent='Building...';try{const j=await api('/api/run',{code});s.innerHTML=/Error/.test(j.stderr||'')?`<span class=err>${esc(j.stderr)}</span>`:`<a href="/outputs/${encodeURIComponent(fn)}" download>${esc(fn)}</a>`}catch(x){s.textContent=x.message}}
function dlScriptX(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([script()],{type:'text/plain'}));a.download=P.name.replace(/\W+/g,'_')+'.R';a.click()}
async function buildDoc(){const e=$('#ed');e.textContent='Building...';try{const o=await api('/api/outputs');let md=`# ${$('#rt').value}\n\n`;
  for(const f of o.tables){const id=f.replace('.csv',''),rows=csv(await (await fetch('/outputs/'+f)).text());let tx=['',''];try{tx=(await (await fetch('/outputs/'+id+'.txt')).text()).split('\n')}catch{}
    const c=r=>'|'+r.map(x=>x.replace(/\|/g,'/')).join('|')+'|';md+=`**${tx[0]}**\n\n${c(rows[0])}\n${c(rows[0].map(()=>'---'))}\n${rows.slice(1).map(c).join('\n')}\n\n*${tx[1]||''}*\n\n`}
  o.figures.forEach(f=>md+=`![${f}](figures/${f})\n\n`);if(P.interp)md+=`## Interpretation\n\n${P.interp}\n\n`;md+='## Appendix: R script\n\n```r\n'+script()+'\n```\n';
  const j=await api('/api/export',{markdown:md});e.innerHTML=`<a href="${j.url}" download>Download report.docx</a>`}catch(x){e.textContent=x.message}}
function show(){$('#nav').textContent='';STAGES.forEach(s=>{const d=document.createElement('div');d.textContent=s;d.className=s===st?'on':'';d.onclick=()=>{st=s;show()};$('#nav').append(d)});
  $('#main').innerHTML=R[st]();if(st==='Tables')P.tables.forEach((t,i)=>prev(i));if(st==='Export')exp()}
async function openP(n,fresh){P=await api('/api/project?name='+encodeURIComponent(n))||blank(n);P.name=n;try{localStorage.lastP=n}catch{}if(fresh)await api('/api/reset',{});await plist();show()}
async function plist(){const l=await api('/api/projects');if(!l.includes(P.name))l.push(P.name);$('#ps').innerHTML=l.map(n=>`<option ${n===P.name?'selected':''}>${esc(n)}</option>`).join('')}
async function newP(){const n=prompt('New project name (e.g. Assignment 2)');if(!n)return;P=blank(n);sv(1);await api('/api/reset',{});await plist();st='Project';show()}
(async()=>{TL=await api('/api/templates').catch(()=>[]);const l=await api('/api/projects');let n='';try{n=localStorage.lastP}catch{}await openP(l.includes(n)?n:l[0]||'Assignment 1')})();
</script></body></html>
